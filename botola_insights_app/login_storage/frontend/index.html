<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0">
<script>
// Invisible helper for "Remember me": keeps the signed login token in this browser's localStorage.
// Python asks for one action per mount: "read" (send the token back), "set" (store it) or
// "clear" (delete it). Talks to Streamlit with the custom-component postMessage protocol.
const KEY = "bi_studio_login";
const send = (type, data) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*");
let done = false;

window.addEventListener("message", (ev) => {
  if (done || !ev.data || ev.data.type !== "streamlit:render") return;
  done = true;  // one action per mount: never loop
  const { action, token } = ev.data.args;
  let stored = null;
  try {
    if (action === "set" && token) localStorage.setItem(KEY, token);
    if (action === "clear") localStorage.removeItem(KEY);
    stored = localStorage.getItem(KEY);
  } catch (e) {
    stored = null;  // storage blocked (private mode, settings): behave as "not remembered"
  }
  if (action === "read") send("streamlit:setComponentValue", { value: { token: stored }, dataType: "json" });
});

send("streamlit:componentReady", { apiVersion: 1 });
send("streamlit:setFrameHeight", { height: 0 });
</script>
</body>
</html>
